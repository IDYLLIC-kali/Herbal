<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Betti Naturals — Owner tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-green: #1a3a28; --brand-green-hover: #12291c;
    --brand-gold: #cda875; --brand-gold-hover: #b89362;
    --bg-main: #f9f8f4; --bg-card: #ffffff; --bg-light-sage: #eaeee5;
    --text-main: #2c332b; --text-muted: #5c665a;
    --border-color: #e5e9e1; --radius: 4px; --shadow: 0 4px 20px rgba(26,58,40,0.05);
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg-main); color:var(--text-main); font-family:'Inter', sans-serif; min-height:100vh;}
  h1,h2,h3{font-family:'Playfair Display', serif; color:var(--brand-green); margin:0; font-weight:600;}
  p{margin:0; color:var(--text-muted); line-height:1.6; font-size:0.9rem;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  svg{display:block; max-width:100%;}

  .admin-shell{max-width:1000px; margin:0 auto; padding:40px 24px 80px;}
  .admin-topbar{display:flex; align-items:center; justify-content:space-between; gap:16px; padding-bottom:20px; border-bottom:1px solid var(--border-color); margin-bottom:30px; flex-wrap:wrap;}
  .admin-brand strong{font-family:'Playfair Display',serif; font-size:1.5rem; color:var(--brand-green);}
  .admin-brand span{display:block; font-size:0.7rem; font-style:italic; color:var(--brand-gold); font-family:'Playfair Display', serif; margin-top:2px;}
  .admin-topbar-actions{display:flex; gap:10px;}
  .btn{display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:var(--radius); font-weight:500; font-size:0.85rem; transition:all 0.2s;}
  .btn-primary{background:var(--brand-green); color:#fff;}
  .btn-primary:hover{background:var(--brand-green-hover);}
  .btn-ghost{border:1px solid var(--border-color); color:var(--brand-green); background:#fff;}
  .btn-ghost:hover{background:var(--bg-light-sage);}
  .btn[disabled]{opacity:0.5; cursor:not-allowed;}

  .admin-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
  .admin-card{background:var(--bg-card); border:1px solid var(--border-color); border-radius:8px; padding:16px; display:flex; gap:16px; align-items:center; box-shadow:var(--shadow);}
  .admin-thumb{width:80px; height:80px; border-radius:4px; background:#f0f2ed; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:12px; color:var(--brand-green); overflow:hidden; position:relative;}
  .admin-thumb img{width:100%; height:100%; object-fit:cover; position:absolute; inset:0;}
  .admin-info{flex:1; min-width:0;}
  .admin-name{font-family:'Playfair Display',serif; font-weight:600; color:var(--brand-green); font-size:1.05rem;}
  .admin-meta{font-size:0.75rem; color:var(--text-muted); margin-bottom:8px;}
  .admin-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px;}
  .admin-actions label{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--radius); background:var(--brand-green); color:#fff; font-size:0.75rem; font-weight:500; cursor:pointer;}
  .admin-actions label:hover{background:var(--brand-green-hover);}
  .admin-actions input[type="file"]{display:none;}
  .price-input{padding:6px 10px; border-radius:4px; border:1px solid var(--border-color); font-size:0.85rem; width:100px; font-family:inherit;}
  
  .settings-card{background:var(--bg-card); border:1px solid var(--border-color); border-radius:8px; padding:30px; margin-top:40px; box-shadow:var(--shadow);}
  .settings-card h2{font-size:1.4rem; margin-bottom:8px;}
  .form-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; margin-top:20px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field label{font-size:0.75rem; font-weight:600; color:var(--brand-green); text-transform:uppercase; letter-spacing:0.05em;}
  .field input, .field select, .field textarea{padding:10px 14px; border-radius:4px; border:1px solid var(--border-color); background:var(--bg-main); font-size:0.9rem; outline:none; font-family:inherit;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--brand-green);}
  .form-actions{margin-top:20px; display:flex; gap:12px; align-items:center;}
  .form-msg{font-size:0.85rem;}
  .form-msg.ok{color:var(--brand-green); font-weight:500;}
  .form-msg.err{color:#b4472f; font-weight:500;}

  .admin-toast{position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--brand-green); color:#fff; padding:12px 24px; border-radius:var(--radius-pill); font-size:0.9rem; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:110; opacity:0; pointer-events:none; transition:all 0.3s;}
  .admin-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .admin-toast.error{background:#b4472f;}

  @media (max-width:768px){
    .admin-grid{grid-template-columns:1fr;}
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-topbar">
    <div class="admin-brand">
      <strong>Betti Naturals</strong>
      <span>Owner Tools</span>
    </div>
    <div class="admin-topbar-actions">
      <button type="button" class="btn btn-ghost" id="viewStorefrontBtn">View Storefront</button>
      <button type="button" class="btn btn-ghost" id="logoutBtn" style="color:#b4472f; border-color:#f0d6d1;">Sign Out</button>
    </div>
  </div>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
    <h2 style="font-size:1.6rem;">Product Catalog</h2>
    <button class="btn btn-ghost" id="refreshBtn">Refresh Data</button>
  </div>

  <div class="admin-grid" id="adminGrid"></div>

  <div class="settings-card">
    <h2>Add New Product</h2>
    <p>Post a product that is currently not in the catalogue. It will appear on the storefront immediately.</p>
    <form id="addProductForm">
      <div class="form-grid">
        <div class="field">
          <label>Product Name</label>
          <input type="text" id="newName" required placeholder="e.g. Lavender Oil">
        </div>
        <div class="field">
          <label>Category</label>
          <select id="newCat" required>
            <option value="oils">Essential Oils</option>
            <option value="powders">Herbs & Powders</option>
            <option value="teas">Herbal Teas</option>
            <option value="nuts">Carrier Oils</option>
          </select>
        </div>
        <div class="field">
          <label>Size (e.g. 100ml, 50g)</label>
          <input type="text" id="newSize" placeholder="Optional">
        </div>
        <div class="field">
          <label>Price (KSh)</label>
          <input type="number" id="newPrice" required min="1">
        </div>
        <div class="field" style="grid-column: 1 / -1;">
          <label>Short Description</label>
          <input type="text" id="newDesc" placeholder="e.g. Calms the mind and promotes relaxation.">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="addProductBtn">Post Product</button>
        <span class="form-msg" id="addProdMsg"></span>
      </div>
    </form>
  </div>

  <div class="settings-card">
    <h2>Account Settings</h2>
    <p>Change your admin username and password. You must enter your current password to save changes.</p>
    <form id="changeCredsForm">
      <div class="form-grid">
        <div class="field">
          <label>Current Password</label>
          <input type="password" id="currentPassword" required>
        </div>
        <div class="field">
          <label>New Username</label>
          <input type="text" id="newUsername" required minlength="3">
        </div>
        <div class="field">
          <label>New Password</label>
          <input type="password" id="newPassword" required minlength="4">
        </div>
        <div class="field">
          <label>Confirm New Password</label>
          <input type="password" id="confirmPassword" required minlength="4">
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" id="saveCredsBtn">Update Credentials</button>
        <span class="form-msg" id="credsMsg"></span>
      </div>
    </form>
  </div>
</div>

<div class="admin-toast" id="adminToast">
  <span id="adminToastText"></span>
</div>

<script>
const IS_FILE_PROTOCOL = window.location.protocol === "file:";
const ICONS = {
  leaf: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22C6.5 22 2 17.5 2 12S6.5 2 12 2s10 4.5 10 10-4.5 10-10 10z"/><path d="M12 6v6l4 2"/></svg>`,
  drop: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>`,
  bottle: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 2h4v5h-4z"/><path d="M8 22V7h8v15z"/><path d="M8 12h8"/></svg>`,
  tea: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>`,
  jar: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="6" y="6" width="12" height="16" rx="2"/><rect x="5" y="3" width="14" height="3" rx="1"/><path d="M9 11h6"/></svg>`
};

const BASE_PRODUCTS = [
  {id:1,  name:"Moringa Leaves",    cat:"powders", size:"100g",  price:400, icon:"leaf"},
  {id:2,  name:"Lavender Essential Oil", cat:"oils", size:"10ml", price:750, icon:"drop"},
  {id:3,  name:"Coconut Carrier Oil", cat:"nuts", size:"250ml", price:650, icon:"bottle"},
  {id:4,  name:"Herbal Tea Blend",  cat:"teas",    size:"50g",   price:450, icon:"tea"},
  {id:5,  name:"Rosemary Essential Oil", cat:"oils", size:"10ml", price:700, icon:"drop"},
  {id:6,  name:"Black Seed Oil",    cat:"nuts",    size:"100ml", price:600, icon:"bottle"},
  {id:7,  name:"Castor Oil",        cat:"nuts",    size:"100ml", price:450, icon:"bottle"},
  {id:8,  name:"Flax Seed Oil",     cat:"nuts",    size:"100ml", price:650, icon:"bottle"},
  {id:9,  name:"Olive Oil",         cat:"nuts",    size:"250ml", price:800, icon:"bottle"},
  {id:10, name:"Argan Oil",         cat:"nuts",    size:"50ml",  price:900, icon:"bottle"},
  {id:11, name:"Red Maca",          cat:"powders", size:"100g",  price:600, icon:"leaf"},
  {id:12, name:"Black Maca",        cat:"powders", size:"100g",  price:650, icon:"leaf"},
  {id:13, name:"Hibiscus Powder",   cat:"powders", size:"100g",  price:320, icon:"leaf"},
  {id:14, name:"Purple Tea",        cat:"teas",    size:"50g",   price:350, icon:"tea"},
  {id:15, name:"Green Tea",         cat:"teas",    size:"50g",   price:300, icon:"tea"},
  {id:16, name:"Hibiscus Flowers",  cat:"teas",    size:"50g",   price:250, icon:"tea"},
  {id:17, name:"Almonds",           cat:"powders", size:"250g",  price:650, icon:"jar"}
];

const CATEGORIES = [
  {id:"oils",    label:"Oils"},
  {id:"powders", label:"Herbs & Powders"},
  {id:"teas",    label:"Teas"},
  {id:"nuts",    label:"Carrier Oils & Nuts"}
];

const catLabel = id => (CATEGORIES.find(c => c.id === id) || {}).label || id;

let photos = {};
let prices = {};
let customProducts = [];
let deletedProducts = [];
const adminGrid = document.getElementById("adminGrid");

function getAllProducts() {
  // Combine base and custom, then filter out any that are marked as deleted
  const combined = [...BASE_PRODUCTS, ...customProducts];
  return combined.filter(p => !deletedProducts.includes(p.id));
}

function renderAdmin(){
  const allProducts = getAllProducts();
  
  adminGrid.innerHTML = allProducts.map(p => {
    return `
    <div class="admin-card">
      <div class="admin-thumb">
        ${photos[p.id] ? `<img src="${photos[p.id]}" alt="${p.name}">` : (ICONS[p.icon] || ICONS.leaf)}
      </div>
      <div class="admin-info">
        <div class="admin-name">${p.name}</div>
        <div class="admin-meta">${catLabel(p.cat)} · ${p.size || 'N/A'}</div>
        
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="font-size:0.75rem; font-weight:600; color:var(--text-muted);">Price (KSh):</span>
          <input type="number" class="price-input" data-price="${p.id}" value="${prices[p.id] || p.price}" min="1">
        </div>

        <div class="admin-actions">
          <label>
            ${photos[p.id] ? "Replace Photo" : "Upload Photo"}
            <input type="file" accept="image/*" data-upload="${p.id}">
          </label>
          ${photos[p.id] ? `<button style="font-size:0.75rem; color:#b4472f; text-decoration:underline;" data-clear-photo="${p.id}">Remove Photo</button>` : ""}
          <button style="font-size:0.75rem; background:#b4472f; color:#fff; padding:6px 12px; border-radius:var(--radius);" data-delete-product="${p.id}">Delete Product</button>
        </div>
      </div>
    </div>
  `}).join("");

  adminGrid.querySelectorAll("input[data-price]").forEach(input => {
    input.addEventListener("change", async e => {
      const id = e.target.dataset.price;
      const val = Number(e.target.value);
      if(!val || val < 1) return;
      e.target.style.opacity = "0.5";
      try {
        const res = await fetch("/api/prices", {
          method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
          body: JSON.stringify({ [id]: val })
        });
        if(!res.ok) throw new Error("Failed to save");
        prices[id] = val;
        showToast(`Price updated to KSh ${val}`);
      } catch(err){
        showToast("Could not save price", true);
      } finally { e.target.style.opacity = "1"; }
    });
  });

  adminGrid.querySelectorAll("input[data-upload]").forEach(input => {
    input.addEventListener("change", async e => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const id = Number(input.dataset.upload);
      const fd = new FormData(); fd.append("photo", file);
      const originalText = input.parentElement.innerText;
      input.parentElement.innerText = "Uploading...";
      try {
        const res = await fetch(`/api/upload/${id}`, { method: "POST", body: fd, credentials: "same-origin" });
        if(!res.ok) throw new Error("Upload failed");
        const data = await res.json();
        photos[id] = data.url;
        showToast("Photo saved");
        renderAdmin();
      } catch(err){
        input.parentElement.innerText = originalText;
        showToast("Upload failed", true);
      }
    });
  });

  adminGrid.querySelectorAll("[data-clear-photo]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!confirm("Remove this product photo?")) return;
      const id = Number(btn.dataset.clearPhoto);
      try {
        await fetch(`/api/upload/${id}`, { method: "DELETE", credentials: "same-origin" });
        delete photos[id];
        showToast("Photo removed");
        renderAdmin();
      } catch(err){ showToast("Delete failed", true); }
    });
  });

  adminGrid.querySelectorAll("[data-delete-product]").forEach(btn => {
    btn.addEventListener("click", async () => {
      if(!confirm("Are you sure you want to completely DELETE this product from the store? This cannot be undone.")) return;
      const id = Number(btn.dataset.deleteProduct);
      try {
        const res = await fetch(`/api/products/${id}`, { method: "DELETE", credentials: "same-origin" });
        if(!res.ok) throw new Error("Delete failed");
        
        // Remove from local memory so it disappears instantly without a full reload
        deletedProducts.push(id);
        customProducts = customProducts.filter(p => p.id !== id);
        delete photos[id];
        
        showToast("Product deleted");
        renderAdmin();
      } catch(err){ showToast("Delete failed", true); }
    });
  });
}

async function loadFromServer(){
  if(IS_FILE_PROTOCOL){ renderAdmin(); return; }
  try {
    const [photosRes, pricesRes, productsRes, deletedRes] = await Promise.all([
      fetch("/api/photos", { cache: "no-store", credentials: "same-origin" }),
      fetch("/api/prices", { cache: "no-store", credentials: "same-origin" }),
      fetch("/api/products", { cache: "no-store", credentials: "same-origin" }),
      fetch("/api/deleted", { cache: "no-store", credentials: "same-origin" })
    ]);
    if(photosRes.ok) photos = await photosRes.json();
    if(pricesRes.ok) prices = await pricesRes.json();
    if(productsRes.ok) customProducts = await productsRes.json();
    if(deletedRes.ok) deletedProducts = await deletedRes.json();
  } catch(e){ showToast("Couldn't reach server", true); }
  renderAdmin();
}

document.getElementById("refreshBtn").addEventListener("click", loadFromServer);

function logOutAndRedirect(url) {
  fetch("/admin/", { headers: { "Authorization": "Basic " + btoa("logout:logout") }, cache: "no-store" })
    .finally(() => { window.location.href = url; });
}

document.getElementById("viewStorefrontBtn").addEventListener("click", () => {
  logOutAndRedirect(window.location.origin + "/");
});

document.getElementById("logoutBtn").addEventListener("click", () => {
  logOutAndRedirect("/");
});

document.getElementById("addProductForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("addProdMsg");
  msg.className = "form-msg"; msg.textContent = "";
  const btn = document.getElementById("addProductBtn");
  btn.disabled = true; btn.textContent = "Posting…";

  const name = document.getElementById("newName").value.trim();
  const cat = document.getElementById("newCat").value;
  const size = document.getElementById("newSize").value.trim();
  const price = Number(document.getElementById("newPrice").value);
  const desc = document.getElementById("newDesc").value.trim();

  try {
    const res = await fetch("/api/products", {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
      body: JSON.stringify({ name, cat, size, price, desc })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Failed to add product");
    
    msg.classList.add("ok"); msg.textContent = "Product added successfully!";
    e.target.reset();
    customProducts.push(data.product);
    renderAdmin();
    showToast("Product added");
  } catch(err) {
    msg.classList.add("err"); msg.textContent = err.message;
    showToast("Error adding product", true);
  } finally {
    btn.disabled = false; btn.textContent = "Post Product";
  }
});

document.getElementById("changeCredsForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("credsMsg");
  msg.className = "form-msg"; msg.textContent = "";

  const currentPassword = document.getElementById("currentPassword").value;
  const newUsername = document.getElementById("newUsername").value.trim();
  const newPassword = document.getElementById("newPassword").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(newPassword !== confirmPassword){
    msg.classList.add("err"); msg.textContent = "Passwords do not match."; return;
  }

  const btn = document.getElementById("saveCredsBtn");
  btn.disabled = true; btn.textContent = "Saving…";

  try {
    const res = await fetch("/api/credentials", {
      method: "POST", headers: { "Content-Type": "application/json" }, credentials: "same-origin",
      body: JSON.stringify({ currentPassword, newUsername, newPassword })
    });
    const data = await res.json().catch(()=>({}));
    if(!res.ok) throw new Error(data.error || `Save failed`);
    
    msg.classList.add("ok"); msg.textContent = `Saved. New username: ${data.username}.`;
    e.target.reset(); showToast("Credentials updated");
    setTimeout(() => { window.location.reload(); }, 1500);
  } catch(err){
    msg.classList.add("err"); msg.textContent = err.message || "Save failed";
    showToast(err.message || "Save failed", true);
  } finally { btn.disabled = false; btn.textContent = "Update Credentials"; }
});

let toastTimer;
function showToast(text, isError){
  const t = document.getElementById("adminToast");
  document.getElementById("adminToastText").textContent = text;
  t.classList.toggle("error", !!isError);
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2400);
}

loadFromServer();
</script>
</body>
</html>
